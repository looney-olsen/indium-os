name: Build Indium OS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies in Debian Container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common debian-archive-keyring gnupg gpgv

      - name: Build Custom Packages
        run: |
          mkdir -p iso/config/includes.chroot/tmp/indium-packages
          for dir in packages/*/; do
            pkg_name=$(basename "${dir%/}")
            dpkg-deb --build --root-owner-group "$dir" "iso/config/includes.chroot/tmp/indium-packages/${pkg_name}_1.0.0_all.deb"
          done
          echo "--- Generated Packages ---"
          ls -la iso/config/includes.chroot/tmp/indium-packages/

      - name: Build ISO (AMD64)
        run: |
          cd iso
          chmod +x config/hooks/normal/0100-install-indium-packages.hook.chroot
          ./auto/config
          lb build
          
      - name: Upload AMD64 ISO
        uses: actions/upload-artifact@v4
        with:
          name: indium-os-amd64
          path: iso/live-image-amd64.hybrid.iso
