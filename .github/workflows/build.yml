name: Build Indium OS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common debian-archive-keyring

      - name: Build Custom Packages
        run: |
          mkdir -p iso/config/packages.chroot
          for dir in packages/*/; do
            pkg_name=$(basename "${dir%/}")
            dpkg-deb --build --root-owner-group "$dir" "iso/config/packages.chroot/${pkg_name}_1.0.0_all.deb"
          done
          echo "--- Generated Packages ---"
          ls -la iso/config/packages.chroot/

      - name: Build ISO (AMD64)
        run: |
          cd iso
          sudo ./auto/config
          sudo lb build
          
      - name: Upload AMD64 ISO
        uses: actions/upload-artifact@v4
        with:
          name: indium-os-amd64
          path: iso/live-image-amd64.hybrid.iso
